name: daily_task_app
description: "A premium AI-powered Todo Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: 22.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/app_icon/app_icon.png"
  min_sdk_android: 21
